<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>
	<style type="text/css">
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body{
			background: #3a3a3a;
			font-family: sans-serif;
		}
		.calci{
			display: flex;
			flex-direction: column;
			width: fit-content;
			padding: 15px 30px;
			margin: 25px auto;
			background: #111;
			border-radius: 10px;
			box-shadow: 10px 15px 10px;
		}
		.calci h2{
			text-align: center;
			font-size: 38px;
			text-transform: uppercase;
			color: white;
			font-weight: 800;
		}
		#screen{
			font-size: 28px;
			width: fit-content;
			margin: 20px 0; 
			height: 70px;
			padding: 10px 15px;
			color: #000;
			font-weight: bold;
			text-align: right;
		}
		.row{
			display: flex;
			justify-content: space-between;
		}
		.row button:not(.last-btn){
			font-size: 24px;
			width: 20%;
			aspect-ratio: 1/1;
			margin: 10px 5px;
			border-radius: 50%;
			border: none;
			cursor: pointer;
			background: #3a3a3a;
			color: white;
			box-shadow: 2px 5px #5a5a5a;
		}
		.row button:active{
			transform: translate(2px,5px);
			box-shadow: none;
		}
		.last-btn{
			background: #6a6a6a;
			color: white;
			font-size: 24px;
			width: 100%;
			aspect-ratio: 16/5;
			height: ;
			margin: 5px;
			border: none;
			border-radius: 15px;
			box-shadow: 2px 5px #3a3a3a;

		}
		.orange{
			background: orange !important;
		}
	</style>
</head>

<body>
	<div class="calci">
		<h2>Calculator</h2>
		<input type="text" disabled id="screen">
		<div class="row">
			<button onclick="setVal(7)">7</button>
			<button onclick="setVal(8)">8</button>
			<button onclick="setVal(9)">9</button>
			<button onclick="setVal('/')" class="orange">/</button>
		</div>
		<div class="row">
			<button onclick="setVal(4)">4</button>
			<button onclick="setVal(5)">5</button>
			<button onclick="setVal(6)">6</button>
			<button onclick="setVal('*')" class="orange">*</button>
		</div>
		<div class="row">
			<button onclick="setVal(1)">1</button>
			<button onclick="setVal(2)">2</button>
			<button onclick="setVal(3)">3</button>
			<button onclick="setVal('-')" class="orange">-</button>
		</div>
		<div class="row">
			<button onclick="setVal('.')">.</button>
			<button onclick="setVal(0)">0</button>
			<button onclick="setVal('+')" class="orange">+</button>
			<button onclick="solve()" class="orange">=</button>
		</div>
		<div class="row">
			<button class="last-btn" onclick="clearSingle()">C</button>
			<button class="last-btn" onclick="clearAll()">AC</button>
		</div>
	</div>

	<script type="text/javascript">
		let screen = document.getElementById('screen')
		function setVal(a){
			screen.value += a;
		}

		function solve(){

			let val = screen.value;
			screen.value = eval(val)
			

		}

		function clearAll(){
			screen.value = ""
		}

		// a.substr(0,a.length-1)
		function clearSingle(){
			screen.value = screen.value.substr(0,screen.value.length-1)
		}

		
	</script>
</body>
</html>
